name: Apply cookie consent microsystem

on:
  push:
    paths:
      - '.github/workflows/apply-cookie-consent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load cookie consent globally
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('assets/site.js')
          text = path.read_text()
          marker = "  const cookieConsentScript = document.createElement('script');"
          if marker not in text:
              insert = """

  /* Global cookie consent microsystem. */
  const cookieConsentScript = document.createElement('script');
  cookieConsentScript.src = '/advanteam/assets/cookie-consent.js';
  cookieConsentScript.defer = true;
  document.head.appendChild(cookieConsentScript);
"""
              idx = text.rfind('\n})();')
              if idx == -1:
                  raise SystemExit('Could not find site.js IIFE closing marker')
              text = text[:idx] + insert + text[idx:]
              path.write_text(text)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.js
          git commit -m "Enable global cookie consent microsystem"
          git push origin main
