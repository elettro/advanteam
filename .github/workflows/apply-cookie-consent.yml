name: Apply cookie consent microsystem

on:
  push:
    paths:
      - .github/workflows/apply-cookie-consent.yml
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load cookie consent globally
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('assets/site.js'); t=p.read_text(); marker=\"  const cookieConsentScript = document.createElement('script');\"; ins=\"\\n\\n  /* Global cookie consent microsystem. */\\n  const cookieConsentScript = document.createElement('script');\\n  cookieConsentScript.src = '/advanteam/assets/cookie-consent.js';\\n  cookieConsentScript.defer = true;\\n  document.head.appendChild(cookieConsentScript);\\n\"; i=t.rfind('\\n})();'); p.write_text(t if marker in t else t[:i]+ins+t[i:])"
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site.js
          git commit -m "Enable global cookie consent microsystem"
          git push origin main
