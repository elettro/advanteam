name: Remove Connections old poster
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-connections-old-poster.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old poster image from Connections video
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('connections/index.html')
          s = p.read_text()
          old = ' poster="/advanteam/assets/udo-connections-poster.jpg"'
          if old not in s:
              raise SystemExit('Expected poster attribute not found')
          p.write_text(s.replace(old, '', 1))
          PY
          rm .github/workflows/remove-connections-old-poster.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add connections/index.html .github/workflows/remove-connections-old-poster.yml
          git commit -m "Remove stale Connections video poster"
          git push
