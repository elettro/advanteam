name: Apply Global Markets hero video
on:
  push:
    paths:
      - '.github/workflows/apply-global-markets-video.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Global Markets hero video
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('global-markets/index.html')
          s=p.read_text()
          old='<div class="fpo-image"><div class="fpo-image-inner"><span class="fpo-label">FPO IMAGE 01</span><h2>Recommended hero image</h2><p>Senior professionals working across international markets in a premium, authentic business environment.</p></div></div>'
          new='<div class="global-markets-hero-video"><video autoplay muted loop playsinline preload="metadata" poster="/advanteam/assets/global-markets-germany-poster.jpg" data-global-markets-video aria-label="Global markets visual centered on Germany"><source src="/advanteam/videos/global-markets-germany-center-5x4.mp4" type="video/mp4"></video></div>'
          if old not in s: raise SystemExit('hero placeholder not found')
          s=s.replace(old,new,1)
          css='''<style>.global-markets-hero-video{position:relative;overflow:hidden;aspect-ratio:5/4;border:1px solid rgba(255,255,255,.2);border-radius:24px;background:#10263a;box-shadow:0 26px 70px rgba(0,0,0,.28)}.global-markets-hero-video video{display:block;width:100%;height:100%;object-fit:cover}@media(max-width:780px){.global-markets-hero-video{border-radius:18px}}</style>'''
          s=s.replace('</head>',css+'</head>',1)
          script='''<script>(()=>{const v=document.querySelector('[data-global-markets-video]');if(!v)return;const setSpeed=()=>{v.playbackRate=.5;v.defaultPlaybackRate=.5};v.addEventListener('loadedmetadata',setSpeed);v.addEventListener('play',setSpeed);setSpeed();v.play().catch(()=>{});})();</script>'''
          s=s.replace('<script src="/advanteam/assets/site.js" defer></script>',script+'<script src="/advanteam/assets/site.js" defer></script>',1)
          p.write_text(s)
          PY
      - name: Commit Global Markets hero video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-markets/index.html
          git diff --cached --quiet || git commit -m "Use looping half-speed Global Markets hero video"
          git push
