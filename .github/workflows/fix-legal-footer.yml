name: Fix legal footer and pages

on:
  push:
    paths:
      - '.github/workflows/fix-legal-footer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build legal pages and compact sitewide footer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          assets = root / 'assets'
          assets.mkdir(exist_ok=True)

          footer_js = r'''(() => {
            const styleId = 'advanteam-legal-footer-styles';
            if (!document.getElementById(styleId)) {
              const style = document.createElement('style');
              style.id = styleId;
              style.textContent = `
                footer.site-footer.legal-footer,
                footer.footer.legal-footer {
                  padding: 0;
                  color: rgba(255,255,255,.72);
                  background: #030d17;
                  border-top: 1px solid rgba(255,255,255,.08);
                }
                .legal-footer-inner {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 28px;
                  min-height: 92px;
                  padding: 22px 0;
                }
                .legal-footer-meta {
                  display: flex;
                  align-items: center;
                  flex-wrap: wrap;
                  gap: 10px 18px;
                  font-size: .86rem;
                }
                .legal-footer-meta strong {
                  color: #fff;
                  font-size: .9rem;
                  letter-spacing: .08em;
                }
                .legal-footer-links {
                  display: flex;
                  align-items: center;
                  justify-content: flex-end;
                  flex-wrap: wrap;
                  gap: 10px 22px;
                  font-size: .86rem;
                }
                .legal-footer-links a {
                  color: rgba(255,255,255,.7);
                  text-decoration: none;
                  transition: color 180ms ease;
                }
                .legal-footer-links a:hover,
                .legal-footer-links a:focus-visible {
                  color: #fff;
                }
                @media (max-width: 760px) {
                  .legal-footer-inner {
                    align-items: flex-start;
                    flex-direction: column;
                    gap: 14px;
                  }
                  .legal-footer-links {
                    justify-content: flex-start;
                  }
                }
              `;
              document.head.appendChild(style);
            }

            const footer = document.querySelector('footer');
            if (!footer) return;
            footer.classList.remove('footer');
            footer.classList.add('site-footer', 'legal-footer');
            footer.innerHTML = `
              <div class="wrap legal-footer-inner">
                <div class="legal-footer-meta">
                  <strong>ADVANTEAM</strong>
                  <span>© <span data-legal-year></span></span>
                  <span>Founded 1998</span>
                </div>
                <nav class="legal-footer-links" aria-label="Legal and company links">
                  <a href="/advanteam/">Home</a>
                  <a href="/advanteam/contact/">Contact</a>
                  <a href="/advanteam/legal/imprint/">Imprint</a>
                  <a href="/advanteam/legal/privacy/">Privacy Policy</a>
                </nav>
              </div>`;
            const year = footer.querySelector('[data-legal-year]');
            if (year) year.textContent = new Date().getFullYear();
          })();
          '''
          (assets / 'legal-footer.js').write_text(footer_js, encoding='utf-8')

          header = '''<header class="site-header" data-header><div class="wrap nav-shell"><a class="brand" href="/advanteam/" aria-label="ADVANTEAM home"><span class="brand-mark"></span><span class="brand-name">ADVANTEAM</span></a><nav class="desktop-nav" aria-label="Primary navigation"><a href="/advanteam/connections/">Connections</a><a href="/advanteam/communications/">Communications</a><a href="/advanteam/consulting/">Consulting</a><div class="nav-dropdown"><button type="button" aria-expanded="false">Global Markets</button><div class="dropdown-panel"><a href="/advanteam/global-markets/">Overview</a><a href="/advanteam/global-markets/germany-europe/">Germany &amp; Europe</a><a href="/advanteam/global-markets/north-america/">North America</a><a href="/advanteam/global-markets/middle-east/">Middle East</a></div></div><div class="nav-dropdown"><button type="button" aria-expanded="false">About</button><div class="dropdown-panel"><a href="/advanteam/about/">ADVANTEAM</a><a href="/advanteam/about/udo-foerster/">Udo Foerster</a><a href="/advanteam/about/references/">Selected References</a><a href="/advanteam/about/history/">Company History</a></div></div><a href="/advanteam/contact/">Contact</a></nav><button class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false" data-menu-button><span></span><span></span><span></span></button></div><div class="mobile-nav" data-mobile-nav><div class="wrap mobile-nav-inner"><a href="/advanteam/connections/">Connections</a><a href="/advanteam/communications/">Communications</a><a href="/advanteam/consulting/">Consulting</a><a href="/advanteam/global-markets/">Global Markets</a><a href="/advanteam/about/">About</a><a href="/advanteam/contact/">Contact</a></div></div></header>'''

          legal_style = '''<style>
          .legal-hero{padding:clamp(76px,9vw,126px) 0 54px;background:#071525;color:#fff}.legal-hero h1{max-width:900px;margin-bottom:18px;font-size:clamp(3rem,7vw,6rem)}.legal-hero p{max-width:760px;color:rgba(255,255,255,.72);font-size:1.1rem}.legal-content{padding:clamp(58px,8vw,108px) 0;background:#fff}.legal-copy{max-width:900px}.legal-copy h2{margin-top:52px;margin-bottom:16px;font-size:clamp(1.6rem,3vw,2.45rem)}.legal-copy h2:first-child{margin-top:0}.legal-copy h3{margin-top:30px;margin-bottom:12px;font-size:1.22rem}.legal-copy p,.legal-copy li{color:#52606d;line-height:1.72}.legal-copy a{color:#215c4c;text-decoration:underline;text-underline-offset:3px}.legal-copy ul{padding-left:22px}.legal-card{margin:28px 0;padding:26px 28px;border:1px solid rgba(7,21,37,.12);border-radius:18px;background:#f7f5f0}.legal-updated{margin-top:54px;padding-top:22px;border-top:1px solid rgba(7,21,37,.12);font-size:.9rem;color:#74808b}
          </style>'''

          imprint_body = '''<section class="legal-hero"><div class="wrap"><p class="eyebrow">Legal</p><h1>Imprint</h1><p>Legal provider information for ADVANTEAM.</p></div></section><section class="legal-content"><div class="wrap legal-copy"><h2>Company information</h2><div class="legal-card"><p><strong>ADVANTEAM Gesellschaft für Kommunikation und Unternehmensberatung mbH</strong><br>Dietrich-Bonhoeffer-Straße 14<br>55268 Nieder-Olm<br>Germany</p><p>Commercial Register: HRB 47579<br>Register Court: Amtsgericht Mainz</p><p>Represented by: Udo Foerster</p></div><h2>Contact</h2><p>Phone: <a href="tel:+4915146566688">+49 151 465 666 88</a><br>Email: <a href="mailto:info@advanteam.de">info@advanteam.de</a></p><h2>VAT identification number</h2><p>VAT identification number pursuant to § 27a of the German VAT Act: DE 205564312.</p><h2>Consumer dispute resolution</h2><p>ADVANTEAM is not willing or obligated to participate in dispute resolution proceedings before a consumer arbitration board.</p><h2>Image sources</h2><p>The site uses photography and visual material from ADVANTEAM and Udo Foerster archives as well as licensed or freely available image sources where applicable.</p><p class="legal-updated">Last updated: August 10, 2026.</p></div></section>'''

          privacy_body = '''<section class="legal-hero"><div class="wrap"><p class="eyebrow">Legal</p><h1>Privacy Policy</h1><p>Information about how ADVANTEAM handles personal data when you use this website or contact the company.</p></div></section><section class="legal-content"><div class="wrap legal-copy"><h2>Responsible entity</h2><div class="legal-card"><p><strong>ADVANTEAM Gesellschaft für Kommunikation und Unternehmensberatung mbH</strong><br>Dietrich-Bonhoeffer-Straße 14<br>55268 Nieder-Olm<br>Germany</p><p>Phone: <a href="tel:+4915146566688">+49 151 465 666 88</a><br>Email: <a href="mailto:info@advanteam.de">info@advanteam.de</a></p></div><h2>Data processed when you visit the website</h2><p>Technical data required to deliver and secure the website may be processed automatically. This may include IP address, browser and device information, operating system, referring page, requested page, and the date and time of access. This information is used for reliable delivery, security, troubleshooting, and protection against misuse.</p><h2>Contact by email or telephone</h2><p>If you contact ADVANTEAM, the information you provide is processed to respond to your request, prepare or perform a business relationship, and manage any necessary follow-up. Data is retained only for as long as required for the relevant purpose or applicable statutory retention obligations.</p><h2>Cookies and local storage</h2><p>Technically necessary browser storage may be used where required for core website functions. Optional technologies that require consent should only be activated after consent has been obtained. You may also manage stored data through your browser settings.</p><h2>Embedded media and external services</h2><p>Pages may include media, links, or services supplied by third parties. When third-party content is loaded, the relevant provider may receive technical connection data. Where consent is legally required for an optional service, the service should remain inactive until consent is provided.</p><h2>Legal bases</h2><p>Depending on the situation, processing is based on consent, steps requested before entering into a contract, performance of a contract, compliance with a legal obligation, or ADVANTEAM's legitimate interest in operating a secure and effective company website and responding to business enquiries.</p><h2>Recipients and service providers</h2><p>Personal data is shared only where necessary for the stated purpose, where required by law, or where a service provider processes data on ADVANTEAM's behalf under appropriate contractual and data-protection safeguards.</p><h2>Retention</h2><p>Personal data is deleted or anonymized when the purpose for processing no longer applies, unless legal retention periods or another lawful basis require continued storage.</p><h2>Your rights</h2><p>Under applicable data-protection law, you may have rights to access, correction, deletion, restriction of processing, data portability, withdrawal of consent, and objection to certain processing. You also have the right to lodge a complaint with the competent supervisory authority.</p><h2>Objection to direct marketing</h2><p>You may object at any time to the use of your personal data for direct marketing. Contact ADVANTEAM using the details above to exercise this right.</p><h2>Security</h2><p>ADVANTEAM uses appropriate technical and organizational measures designed to protect personal data. Internet transmission is not completely risk-free, so confidential information should be shared through appropriate channels.</p><p class="legal-updated">Last updated: August 10, 2026.</p></div></section>'''

          def page(title, description, body):
              return f'''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{title} | ADVANTEAM</title><meta name="description" content="{description}"><link rel="icon" href="/advanteam/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/advanteam/assets/site.css">{legal_style}</head><body><a class="skip-link" href="#main">Skip to content</a>{header}<main id="main">{body}</main><footer class="site-footer"></footer><script src="/advanteam/assets/site.js" defer></script><script src="/advanteam/assets/legal-footer.js" defer></script></body></html>'''

          imprint_path = root / 'legal' / 'imprint' / 'index.html'
          privacy_path = root / 'legal' / 'privacy' / 'index.html'
          imprint_path.parent.mkdir(parents=True, exist_ok=True)
          privacy_path.parent.mkdir(parents=True, exist_ok=True)
          imprint_path.write_text(page('Imprint', 'Legal provider information for ADVANTEAM.', imprint_body), encoding='utf-8')
          privacy_path.write_text(page('Privacy Policy', 'Privacy information for visitors and contacts of ADVANTEAM.', privacy_body), encoding='utf-8')

          script_tag = '<script src="/advanteam/assets/legal-footer.js" defer></script>'
          for path in root.rglob('index.html'):
              if path.parts and path.parts[0] == 'tagline':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'assets/legal-footer.js' not in text:
                  text = text.replace('</body>', script_tag + '</body>')
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit legal page structure
        shell: bash
        run: |
          rm -f .github/workflows/fix-legal-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Separate legal pages and compact footer links"
            git push origin HEAD:main
          fi