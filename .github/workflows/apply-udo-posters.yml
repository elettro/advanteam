name: Apply Udo poster assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply poster images to video cards
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('index.html')
          text = home.read_text()
          old = '<video data-hero-video preload="auto" muted playsinline aria-label="Udo Foerster introduces ADVANTEAM" src="'
          new = '<video data-hero-video preload="metadata" muted playsinline poster="/advanteam/assets/udo-homepage-poster.jpg" aria-label="Udo Foerster introduces ADVANTEAM" src="'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('&amp;raw=1#t=1.2">Your browser does not support HTML video.</video><button class="hero-video-activate"', '&amp;raw=1">Your browser does not support HTML video.</video><button class="hero-video-activate"', 1)
          home.write_text(text)

          connections = Path('connections/index.html')
          text = connections.read_text()
          old = '<video data-connections-video preload="auto" muted playsinline aria-label="Udo Foerster introduces ADVANTEAM\'s three Cs" src="'
          new = '<video data-connections-video preload="metadata" muted playsinline poster="/advanteam/assets/udo-connections-poster.jpg" aria-label="Udo Foerster introduces ADVANTEAM\'s three Cs" src="'
          if old in text:
              text = text.replace(old, new, 1)
          text = text.replace('&amp;raw=1#t=1.2">Your browser does not support HTML video.</video><button class="connections-video-activate"', '&amp;raw=1">Your browser does not support HTML video.</video><button class="connections-video-activate"', 1)
          connections.write_text(text)

          for extra in [
              Path('assets/udo-homepage-poster.svg'),
              Path('assets/udo-connections-poster.svg'),
              Path('assets/udo-homepage-poster.jpg.txt'),
              Path('.github/workflows/apply-udo-posters.yml'),
          ]:
              if extra.exists():
                  extra.unlink()
          PY
      - name: Commit poster optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use fast local Udo poster images"
            git push
          fi
